<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪烁爱心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, #2b1055, #0d0221 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .big-heart {
    position: relative;
    width: 140px;
    height: 140px;
    background: linear-gradient(135deg, #ff2d55, #ff6b9d);
    transform: rotate(-45deg);
    animation: heartbeat 1.2s ease-in-out infinite;
    box-shadow: 0 0 60px rgba(255, 45, 85, .8);
  }
  .big-heart::before, .big-heart::after {
    content: "";
    position: absolute;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff2d55, #ff6b9d);
  }
  .big-heart::before { top: -70px; left: 0; }
  .big-heart::after  { top: 0; left: 70px; }
  @keyframes heartbeat {
    0%, 100% { transform: rotate(-45deg) scale(1); }
    25%      { transform: rotate(-45deg) scale(1.15); }
    50%      { transform: rotate(-45deg) scale(1); }
    75%      { transform: rotate(-45deg) scale(1.1); }
  }
  .title {
    position: absolute;
    bottom: 12%;
    color: #ffb3c6;
    font-size: 26px;
    letter-spacing: 8px;
    text-shadow: 0 0 12px rgba(255, 107, 157, .9);
    animation: titleGlow 1.6s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { opacity: .65; text-shadow: 0 0 8px rgba(255,107,157,.5); }
    50%      { opacity: 1;   text-shadow: 0 0 20px rgba(255,107,157,1); }
  }
  .spark {
    position: absolute;
    opacity: 0;
    user-select: none;
    animation: twinkle 2.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3) rotate(0deg); }
    50%      { opacity: 1; transform: scale(1.15) rotate(12deg); }
  }
  .float-heart {
    position: absolute;
    pointer-events: none;
    animation: floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(.6); }
    100% { opacity: 0; transform: translateY(-160px) scale(1.4); }
  }
</style>
</head>
<body>
  <div class="big-heart"></div>
  <div class="title">❤ LOVE ❤</div>
  <script>
    const emojis = ["💗", "💖", "💕", "❤️", "💘", "💞"];
    for (let i = 0; i < 40; i++) {
      const s = document.createElement("div");
      s.className = "spark";
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 96 + "%";
      s.style.top = Math.random() * 92 + "%";
      s.style.fontSize = 14 + Math.random() * 26 + "px";
      document.body.appendChild(s);
    }
    document.addEventListener("click", function(e) {
      const h = document.createElement("div");
      h.className = "float-heart";
      h.textContent = "❤";
      h.style.left = e.clientX + "px";
      h.style.top = e.clientY + "px";
      h.style.color = "#ff6b9d";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1600);
    });
  </script>
</body>
</html>
